name: yawi
description: "Yawi — courses et livraisons à Conakry (application passager et chauffeur)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.5.0
  dio: ^5.8.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  file_selector: ^1.0.3
  flutter_map: ^8.1.1
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.0
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  provider: ^6.1.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  wakelock_plus: ^1.3.0
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: Boldonse
      fonts:
        - asset: assets/fonts/Boldonse-Regular.ttf
