# Alternative à GitHub Actions : Codemagic (500 minutes macOS gratuites par mois pour un compte personnel).
# Dans Codemagic : Teams → Integrations → App Store Connect → ajouter la clé API sous le nom « yawi-asc ».
# Variables (groupe « yawi ») : GOOGLE_SERVICE_INFO_PLIST (contenu du fichier, facultatif).
workflows:
  ios-release:
    name: Yawi iOS (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: yawi-asc
    environment:
      flutter: stable
      xcode: latest
      groups:
        - yawi
      vars:
        YAWI_URL: https://yawi.elitegroupe-sarl.com
      ios_signing:
        distribution_type: app_store
        bundle_identifier: gn.yawi.app
    scripts:
      - name: Firebase
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            mkdir -p ios/Runner
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          fi
      - name: Projet iOS
        script: python3 tool/prepare_ios.py
      - name: Profils de signature
        script: xcode-project use-profiles
      - name: Dépendances
        script: flutter pub get
      - name: IPA
        script: |
          flutter build ipa --release --dart-define=YAWI_URL=$YAWI_URL --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
